<html>
<head>
    <title>HAB's Location</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <script type="text/javascript" src="leaflet/leaflet.js"></script>
    <script type="text/javascript" src="leafletembed.js"></script>
    <script src='//api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>
    <script
              src="https://code.jquery.com/jquery-3.3.1.min.js"
              integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
              crossorigin="anonymous"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js'></script>
    <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css' rel='stylesheet' />
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #map {
            position: absolute; top: 0; left: 0; right: 0;
            bottom: 80px; /* room for quick bar */
        }
        /* Quick bar: always visible at bottom */
        #quick-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: white; border-top: 1px solid #ddd;
            padding: 8px 12px 12px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
        }
        #quick-bar .row {
            display: flex; align-items: center; gap: 8px;
        }
        #quick-bar select {
            flex: 1; padding: 10px; font-size: 16px;
            border: 1px solid #ccc; border-radius: 8px; background: white;
        }
        #quick-bar button {
            padding: 10px 16px; font-size: 15px; border-radius: 8px;
            border: 1px solid #ccc; background: #f5f5f5; cursor: pointer;
            white-space: nowrap;
        }
        #btn-settings {
            padding: 10px 14px; border-radius: 8px;
            border: 2px solid #1a73e8; background: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .dest-group {
            display: flex; gap: 6px; flex: 1;
        }
        .dest-group label {
            flex: 1; text-align: center; padding: 8px 4px; font-size: 14px;
            border: 1px solid #ccc; border-radius: 8px; cursor: pointer;
            user-select: none; transition: background 0.15s;
        }
        .dest-group input[type=radio] { display: none; }
        .dest-group input[type=radio]:checked + label {
            background: #1a73e8; color: white; border-color: #1a73e8;
        }
        /* Settings drawer */
        #settings-backdrop {
            display: none; position: fixed; inset: 0; z-index: 1999;
            background: rgba(0,0,0,0.3);
        }
        #settings-backdrop.open { display: block; }
        #settings-panel {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000;
            background: white; border-radius: 16px 16px 0 0;
            padding: 0 16px 24px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            transform: translateY(100%); transition: transform 0.3s ease;
        }
        #settings-panel.open { transform: translateY(0); }
        #settings-panel .drag-handle {
            width: 40px; height: 4px; background: #ccc; border-radius: 2px;
            margin: 12px auto 16px;
        }
        #settings-panel h3 {
            margin: 14px 0 6px; font-size: 12px; color: #888;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        #settings-panel input[type=text], #settings-panel input[type=datetime-local] {
            width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px;
            border: 1px solid #ccc; border-radius: 8px; margin-bottom: 8px;
        }
        #settings-panel label {
            display: flex; align-items: center; gap: 10px;
            margin: 8px 0; font-size: 16px;
        }
        #settings-panel input[type=checkbox] {
            width: 20px; height: 20px; flex-shrink: 0;
        }
        .param-row {
            display: flex; flex-direction: column; margin-bottom: 8px;
        }
        .param-row span {
            font-size: 13px; color: #555; margin-bottom: 4px;
        }
        /* Map overlay styles */
        #info_text {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 90vw; max-width: 560px; box-sizing: border-box;
            background: rgba(255,255,255,0.55); padding: 10px 16px;
            border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.25);
            font-size: 14px; z-index: 999; pointer-events: none;
        }
        #eta_text {
            background: rgba(255,255,255,0.55); padding: 8px 12px;
            border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.25);
            font-size: 14px;
        }
        #info_text h2, #eta_text h2 { margin: 0 0 4px; font-size: 15px; }
        #info_text h3, #eta_text h3 { margin: 2px 0; font-size: 13px; font-weight: normal; }
        .nav-link {
            display: block; text-decoration: none; color: inherit;
            background: rgba(0,0,0,0.1); border-radius: 8px;
            padding: 4px 8px; margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Full-screen map -->
    <div id="map"></div>

    <!-- Payload info overlay: centered above quick bar -->
    <div id="info_text">
        <h2><span class="distintivo"></span>: <span class="tiempo"></span></h2>
        <h3>Data: <span class="datos"></span></h3>
    </div>

    <!-- Quick bar: always visible -->
    <div id="quick-bar">
        <div class="row">
            <select id="indicativo" onchange="globo_marker=null; firstLoad=true; recarga()">
                <option value="EA2DVJ-11">EA2DVJ-11</option>
                <option value="EA4GZT-11">EA4GZT-11</option>
            </select>
            <button onclick="recarga()">⟳ Reload</button>
            <button id="btn-settings" onclick="openSettings()"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a73e8" xmlns="http://www.w3.org/2000/svg"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.3.07-.62.07-.96s-.03-.66-.07-1l2.05-1.63c.18-.14.23-.41.12-.62l-1.95-3.37c-.12-.22-.37-.3-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.9c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.62l2.05 1.63c-.04.34-.07.67-.07 1s.03.65.07.99L2.86 14.74c-.18.14-.23.41-.12.62l1.95 3.37c.12.22.37.3.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.9c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.95-3.37c.12-.21.07-.47-.12-.62l-2.01-1.58z"/></svg></button>
        </div>
        <div class="row">
            <div class="dest-group">
                <input type="radio" id="dest_nada" name="destino" value="dest_nada" onchange="recarga()">
                <label for="dest_nada">✖ No calc</label>

                <input type="radio" id="dest_globo" name="destino" value="dest_globo" onchange="recarga()">
                <label for="dest_globo">🎈 Globo</label>

                <input type="radio" id="dest_meta" name="destino" value="dest_meta" checked onchange="recarga()">
                <label for="dest_meta">🏁 Meta</label>
            </div>
        </div>
    </div>

    <!-- Settings backdrop -->
    <div id="settings-backdrop" onclick="closeSettings()"></div>

    <!-- Settings drawer -->
    <div id="settings-panel">
        <div class="drag-handle"></div>

        <h3>Auto-refresh</h3>
        <div class="param-row">
            <span>Intervalo de actualización (s)</span>
            <input type="text" id="refresh_interval" name="refresh_interval" value="30" onchange="set_interval()">
        </div>

        <h3>Simulación</h3>
        <label><input type="checkbox" id="bajando" value="bajando" onchange="recarga()"> Simula caída</label>
        <label><input type="checkbox" id="inicial" value="inicial" onchange="recarga()"> Simula desde base</label>

        <h3>Parámetros de vuelo</h3>
        <div class="param-row">
            <span>Velocidad de ascenso</span>
            <input type="text" id="ascent_rate" name="ascent_rate" value="6.19">
        </div>
        <div class="param-row">
            <span>Altura máxima</span>
            <input type="text" id="burst_alt" name="burst_alt" value="30000">
        </div>
        <div class="param-row">
            <span>Velocidad de descenso</span>
            <input type="text" id="descent_rate" name="descent_rate" value="6.23">
        </div>

        <h3>Posición de lanzamiento</h3>
        <div class="param-row">
            <span>Latitud inicial</span>
            <input type="text" id="lat_ini" name="lat_ini" value="41.427120">
        </div>
        <div class="param-row">
            <span>Longitud inicial</span>
            <input type="text" id="lon_ini" name="lon_ini" value="-0.497780">
        </div>
        <div class="param-row">
            <span>Altitud inicial</span>
            <input type="text" id="alt_ini" name="alt_ini" value="160">
        </div>
        <div class="param-row">
            <span>Fecha inicial</span>
            <input type="text" id="fecha_ini" name="fecha_ini" value="2026-06-20T09:00:00.000Z">
        </div>

        <h3>Track</h3>
        <div id="track-info" style="font-size:13px;color:#555;margin-bottom:8px;"></div>
        <div class="row" style="gap:8px">
            <button onclick="downloadTrack()" style="flex:1;padding:10px;font-size:15px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer">⬇ Download GPX</button>
            <button onclick="clearTrack()" style="flex:1;padding:10px;font-size:15px;border-radius:8px;border:1px solid #fcc;background:#fff0f0;color:#c00;cursor:pointer">✕ Clear track</button>
        </div>
    </div>

    <script>
        var my_position;
        var globo_position;
        var finish_position;
        var track;
        var xhr_llevame;
        var asc_poly, des_poly, history_poly;
        var globo_marker, my_marker, finish_marker;
        var firstLoad = true;
        var refresh_interval_id;

        function trackKey(callsign) {
            var d = new Date();
            var dateStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
            return 'hab_track_' + callsign + '_' + dateStr;
        }

        function loadTrack(callsign) {
            try {
                return JSON.parse(localStorage.getItem(trackKey(callsign)) || '[]');
            } catch(e) { return []; }
        }

        function saveTrack(callsign, positions) {
            try { localStorage.setItem(trackKey(callsign), JSON.stringify(positions)); } catch(e) {}
        }

        function pruneOldTracks() {
            var cutoff = Date.now() - 48 * 3600 * 1000;
            Object.keys(localStorage).forEach(function(key) {
                if (!key.startsWith('hab_track_')) return;
                try {
                    var positions = JSON.parse(localStorage.getItem(key) || '[]');
                    if (positions.length && new Date(positions[0].t).getTime() < cutoff) {
                        localStorage.removeItem(key);
                    }
                } catch(e) { localStorage.removeItem(key); }
            });
        }

        pruneOldTracks();

        function downloadTrack() {
            var callsign = $("#indicativo").val();
            var positions = loadTrack(callsign);
            if (!positions.length) { alert('No hay datos de track para ' + callsign); return; }
            var gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="HAB Tracker">\n  <trk><name>' + callsign + '</name><trkseg>\n';
            positions.forEach(function(p) {
                var dt = new Date(p.t * 1000).toISOString();
                gpx += '    <trkpt lat="' + p.lat + '" lon="' + p.lng + '"><ele>' + p.alt + '</ele><time>' + dt + '</time></trkpt>\n';
            });
            gpx += '  </trkseg></trk>\n</gpx>';
            var blob = new Blob([gpx], {type: 'application/gpx+xml'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = callsign + '_' + new Date().toISOString().slice(0, 10) + '.gpx';
            a.click();
        }

        function clearTrack() {
            var callsign = $("#indicativo").val();
            localStorage.removeItem(trackKey(callsign));
            try { map.removeLayer(history_poly); } catch(e) {}
            history_poly = null;
            $('#track-info').text(callsign + ' — 0 puntos');
        }

        function openSettings() {
            document.getElementById('settings-panel').classList.add('open');
            document.getElementById('settings-backdrop').classList.add('open');
        }
        function closeSettings() {
            document.getElementById('settings-panel').classList.remove('open');
            document.getElementById('settings-backdrop').classList.remove('open');
        }

        recarga();
        initmap();

        map.addControl(new L.Control.Fullscreen());

let textbox_eta = L.Control.extend({
            onAdd: function() {
                var text = L.DomUtil.create('div');
                text.id = "eta_text";
                text.innerHTML = '<h2>Llegada:</h2><h3><a class="nav-link globo-geo">🎈 Globo: <span class="eta_globo"></span></a></h3><h3><a class="nav-link meta-geo">🚗 Coche: <span class="eta_coche"></span> <span class="eta_dest_icon"></span></a></h3>'
                return text;
            },
        });
        new textbox_eta({ position: 'topright' }).addTo(map);

        /* Rectángulo límites */
        var bounds = [[41.48937,-0.53218], [40.871279,-1.381347]];
        L.rectangle(bounds, {fill:false, color: "#ff7800", weight: 2}).addTo(map);

        refresh_interval_id = setInterval(function () { recarga(); }, 1000 * parseInt($("#refresh_interval").val()));

        function set_interval() {
            if (refresh_interval_id !== undefined) {
               clearInterval(refresh_interval_id);
            }
            refresh_interval_id = setInterval(function () { recarga(); }, 1000 * parseInt($("#refresh_interval").val()));
        }

        function millis2time(diff) {
           let ms = diff % 1000;
           let ss = Math.floor(diff / 1000) % 60;
           let mm = Math.floor(diff / 1000 / 60) % 60;
           let hh = Math.floor(diff / 1000 / 60 / 60);
           return "" + hh + ":" + mm;
        }

        function recarga() {
            let encuentrame = navigator.geolocation.getCurrentPosition((pos) => {
                my_position = [pos.coords.latitude, pos.coords.longitude];
                my_marker = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
                llevame();
            });
            $.ajax({
                url: "aprs.php?indicativo=" + $("#indicativo").val(),
                type: "GET",
                dataType: "json",
                success: function (foo) {
                   $(".distintivo").text($("#indicativo").val());
                   $fecha = new Date();
                   $fecha.setTime(foo.entries[0].lasttime*1000);
                   $(".tiempo").text($fecha.toLocaleString('en-GB'));
                   $(".datos").text(foo.entries[0].comment.replace(/,/g,', '));
                   url = "https://osmand.net/go?lat="+foo.entries[0].lat+"&lon="+foo.entries[0].lng;
                   $(".globo").text(url);
                   $(".globo").attr("href",url);
                   $lat = foo.entries[0].lat;
                   $lng = foo.entries[0].lng;
                   globo_position = [foo.entries[0].lat, foo.entries[0].lng, foo.entries[0].altitude];

                   // Update or create the balloon marker
                   var globoIcon = new L.Icon({iconUrl: 'globo.png'});
                   if (globo_marker) {
                       globo_marker.setLatLng([$lat, $lng]);
                   } else {
                       globo_marker = L.marker([$lat, $lng], {icon: globoIcon}).addTo(map);
                   }

                   // Store position in localStorage (deduplicate by timestamp)
                   var callsign = $("#indicativo").val();
                   var positions = loadTrack(callsign);
                   var lastTime = foo.entries[0].lasttime;
                   if (!positions.length || positions[positions.length - 1].t !== lastTime) {
                       positions.push({t: lastTime, lat: $lat, lng: $lng, alt: foo.entries[0].altitude});
                       saveTrack(callsign, positions);
                   }

                   // Draw historical track in purple
                   try { map.removeLayer(history_poly); } catch(e) {}
                   if (positions.length > 1) {
                       var latlngs = positions.map(function(p) { return [p.lat, p.lng]; });
                       history_poly = L.polyline(latlngs, {color: '#9c27b0', weight: 3}).addTo(map);
                   }
                   $('#track-info').text(callsign + ' — ' + positions.length + ' punto' + (positions.length !== 1 ? 's' : ''));

                   $(".globo-geo").attr("href", "geo:" + $lat + "," + $lng + "?q=" + $lat + "," + $lng + "(" + callsign + ")");
                   simula(globo_position);
               },
            });
        };

        function llevame() {
          if ( $("input[name=destino]:checked").val() == 'dest_globo' ){
             llevame_dest(globo_position);
          } else if ( $("input[name=destino]:checked").val() == 'dest_meta' ){
             llevame_dest(finish_position);
          }
        }

        function llevame_dest(dest) {
          if (my_position !== undefined) {
             if (xhr_llevame) { xhr_llevame.abort(); }
             var point1 = "" + my_position[0] + "," + my_position[1];
             var point2 = "" + dest[0] + "," + dest[1];
             xhr_llevame = $.ajax({
                url: "https://graphhopper.com/api/1/route?point="+ point1,
                data: {point: point2, type: "gpx", key: "a54c1ef8-63cb-42c5-817d-326e8aa31587"},
                type: "GET",
                success: function (gpx_track) {
                   try { map.removeLayer(track); } catch(e) {}
                   track = omnivore.gpx.parse(gpx_track)
                   track.addTo(map);
                   track.eachLayer(function(layer){
                      if (layer.feature && layer.feature.properties && layer.feature.properties.coordTimes) {
                         first_point_c = layer.feature.properties.coordTimes.at(0);
                         last_point_c = layer.feature.properties.coordTimes.at(-1);
                         let first_date_c = new Date(first_point_c);
                         let last_date_c = new Date(last_point_c);
                         eta_coche = millis2time(last_date_c - first_date_c);
                         $('.eta_coche').text(eta_coche);
                         $('.eta_dest_icon').text($("input[name=destino]:checked").val() == 'dest_meta' ? '🏁' : '🎈');
                      }
                   });
                },
             });
          } else {
             console.log("Location not available");
          }
        }

        function wrapLng(lng) {
           if (lng < 0) { lng = parseFloat(lng) + 360 };
           return lng;
        }
        function unWrapLng(lng) {
           if (lng > 180) { lng = lng - 360 };
           return lng;
        }

        function simula(position) {
           $fecha_sim = new Date().toISOString();
           $ascent_rate = $("#ascent_rate").val();
           $descent_rate = $("#descent_rate").val();
           $burst_alt = $("#burst_alt").val();
           if ( $("#inicial").prop('checked') ) {
              position[0] = $("#lat_ini").val();
              position[1] = $("#lon_ini").val();
              position[2] = $("#alt_ini").val();
              $fecha_sim = $("#fecha_ini").val();
           } else if ( $("#bajando").prop('checked') || parseInt(position[2]) > parseInt($burst_alt) ) {
              $burst_alt = (parseInt(position[2])+1)
           }
           $url = "https://api.v2.sondehub.org/tawhiri?launch_latitude="+position[0]+"&launch_longitude="+wrapLng(position[1])+"&launch_datetime="+$fecha_sim+"&ascent_rate="+$ascent_rate+"&descent_rate="+$descent_rate+"&burst_altitude="+$burst_alt+"&launch_altitude="+position[2];
           try { map.removeLayer(asc_poly); map.removeLayer(des_poly); map.removeLayer(finish_marker); } catch (error) {};
           $.getJSON(
              $url,
              function (data) {
                 var asc_points = data.prediction[0].trajectory.map(function(x) {
                    return [x.latitude, unWrapLng(x.longitude)];
                 });
                 asc_poly = L.polyline(asc_points, {color: 'green'}).addTo(map);
                 var des_points = data.prediction[1].trajectory.map(function(x) {
                    return [x.latitude, unWrapLng(x.longitude)];
                 });
                 first_point = data.prediction[0].trajectory.at(0);
                 last_point = data.prediction[1].trajectory.at(-1);
                 let first_date = new Date(first_point.datetime);
                 let last_date = new Date(last_point.datetime);
                 eta_globo = millis2time(last_date - first_date);
                 des_poly = L.polyline(des_points, {color: 'red'}).addTo(map);
                 if (firstLoad) {
                    map.fitBounds(des_poly.getBounds().extend(asc_poly.getBounds()));
                    firstLoad = false;
                 }
                 finish_position = des_points[des_points.length - 1];
                 finish_marker = L.marker(finish_position).addTo(map);
                 $(".meta-geo").attr("href", "geo:" + finish_position[0] + "," + finish_position[1] + "?q=" + finish_position[0] + "," + finish_position[1] + "(Meta)");
                 $("#button_llevame_meta").prop('disabled', false);
                 $(".eta_globo").text(eta_globo);
              }
           );
        };

    </script>

</body>
</html>
